[build]
  publish = "public"
  functions = "netlify/functions"

[build.processing]
  skip_processing = true

[[redirects]]
  from = "/api/*"
  to = "https://jevbrain-backend-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
