[build]
  publish = "public"
  functions = "netlify/functions"

[build.processing]
  skip_processing = true

[[redirects]]
  from = "/api/*"
  to = "https://jevbrain-backend-production.up.railway.app/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api-keys"
  to = "/api-keys.html"
  status = 200

[[redirects]]
  from = "/how-it-works"
  to = "/how-it-works.html"
  status = 200

[[redirects]]
  from = "/roadmap"
  to = "/roadmap.html"
  status = 200

[[redirects]]
  from = "/verify"
  to = "/verify.html"
  status = 200

[[redirects]]
  from = "/rules"
  to = "/rules.html"
  status = 200

[[redirects]]
  from = "/teaser"
  to = "/teaser.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

